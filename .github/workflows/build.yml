name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build dictionary
        shell: pwsh
        run: |
          node tools/build-dict.mjs
          node tools/build-rime.mjs

      - name: Build Windows packages
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File installer/build.ps1
          powershell -ExecutionPolicy Bypass -File installer/build-rime-package.ps1

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhiyi-ime-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/安装说明.txt
          if-no-files-found: error

      - name: Prepare beta release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $out = Join-Path "release" $tag
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item "dist\知意输入法-1.0.0-Setup.exe" (Join-Path $out "知意输入法-$tag-Setup.exe")
          Copy-Item "dist\知意输入法-1.0.0-Portable.zip" (Join-Path $out "知意输入法-$tag-Portable.zip")
          Copy-Item "dist\知意输入法-Rime-1.0.0.zip" (Join-Path $out "知意输入法-$tag-Rime.zip")
          Get-ChildItem $out -File | Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content (Join-Path $out "SHA256SUMS.txt") -Encoding utf8

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "知意 1.0.0 Beta 1 · 开发者预览"
          body_path: RELEASE_NOTES-1.0.0-beta.1.md
          prerelease: true
          files: |
            release/${{ github.ref_name }}/*.exe
            release/${{ github.ref_name }}/*.zip
            release/${{ github.ref_name }}/SHA256SUMS.txt
