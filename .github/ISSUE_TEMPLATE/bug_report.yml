name: 问题反馈
description: 安装、候选、部署或常用段落出问题时使用
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认：你用的是**网页工作台**还是**小狼毫 Rime 方案**。
        不要粘贴真实地址、电话、税号或账号。
  - type: dropdown
    id: product
    attributes:
      label: 使用方式
      options:
        - 小狼毫 Rime 方案
        - 网页工作台（浏览器）
        - 两个都用
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 知意版本
      placeholder: "例如 1.0.0 / beta.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: "例如 Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: weasel
    attributes:
      label: 小狼毫版本
      placeholder: "例如 0.17.4；仅网页版可填“未使用”"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序写清楚你点了什么、输入了什么。
      placeholder: |
        1. 打开 ...
        2. 输入 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息（可选）
      description: 可粘贴版本、错误提示、日志；请先打码个人信息。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除地址、电话、税号、账号等敏感信息
          required: true
